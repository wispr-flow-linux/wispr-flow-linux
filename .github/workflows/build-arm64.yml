name: Build Package ARM64 (Reusable)

# Builds one package format for aarch64. Wispr publishes only a Windows x64
# installer, so this extracts the SAME x64 .exe (the app bundle is arch-neutral
# JS/asar) and pairs it with the arm64 Electron runtime, arm64-rebuilt native
# modules, and the aarch64 helper.

on:
  workflow_call:
    inputs:
      build_flags:
        description: 'Flags to pass to build.sh (e.g., "--build deb --clean no")'
        required: false
        type: string
        default: ""
      artifact_suffix:
        description: "Suffix for the artifact name (deb, rpm, appimage)"
        required: true
        type: string
      release_tag:
        description: "Release tag (e.g., v1.0.0+wispr1.5.695) to derive package version"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    container: ${{ inputs.artifact_suffix == 'rpm' && 'fedora:42' || '' }}
    env:
      GH_TOKEN: ${{ github.token }}
      # appimagetool is itself an AppImage; extract-and-run it instead of relying
      # on FUSE, which is unreliable on hosted runners. No-op for the deb/rpm legs.
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies (Fedora)
        if: inputs.artifact_suffix == 'rpm'
        run: |
          # nodejs/npm: @electron/asar extract+repack and native-module fetch.
          # build.sh's dependency installer (scripts/setup/dependencies.sh) pulls
          # the rest (p7zip, python3, rpm-build, ...) once it runs.
          dnf install -y git findutils which curl nodejs npm

      - name: Install AppImage tooling (Ubuntu)
        if: inputs.artifact_suffix == 'appimage'
        run: |
          sudo apt-get update
          # zsync lets the appimage maker emit a .zsync delta for AppImage
          # auto-updates (AppImageUpdate / appimaged).
          sudo apt-get install -y libfuse2 zsync
          # appimagetool is not a distro package; fetch the arch-matched build so
          # the appimage maker (scripts/packaging/appimage.sh) finds it on PATH.
          curl -fSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Make scripts executable
        run: chmod +x ./build.sh scripts/setup/fetch-helper-bin.sh

      - name: Download the pinned Wispr Flow installer
        # The build never resolves "latest": it downloads the URL pinned in
        # scripts/setup/installer-pin.sh and refuses it unless the sha256
        # matches. Only check-wispr-version.yml looks at upstream's manifest.
        run: |
          source scripts/setup/installer-pin.sh
          echo "Downloading installer ${WISPR_VERSION}: ${WISPR_INSTALLER_URL}"
          curl -fSL -o wispr-flow-setup.exe "$WISPR_INSTALLER_URL"
          echo "${WISPR_INSTALLER_SHA256}  wispr-flow-setup.exe" | sha256sum -c -

      - name: Fetch pinned helper binary (aarch64)
        run: |
          echo "HELPER_BIN=$(scripts/setup/fetch-helper-bin.sh aarch64)" >> "$GITHUB_ENV"

      - name: Run build script
        run: |
          TAG_FLAG=""
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG_FLAG="--release-tag ${{ inputs.release_tag }}"
          fi
          # shellcheck disable=SC2086  # build_flags / TAG_FLAG are multi-word
          # flag strings that MUST word-split into separate argv entries.
          ./build.sh ${{ inputs.build_flags }} --exe wispr-flow-setup.exe $TAG_FLAG

      - name: Collect built artifacts
        run: |
          mkdir -p out
          find build-linux \
            \( -name 'wispr-flow_*.deb' \
            -o -name 'wispr-flow-*.rpm' \
            -o -name 'wispr-flow-*.AppImage' \
            -o -name 'wispr-flow-*.AppImage.zsync' \) \
            -exec cp -v {} out/ \;

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-arm64-${{ inputs.artifact_suffix }}
          path: out/*
          if-no-files-found: error
